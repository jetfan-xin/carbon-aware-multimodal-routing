<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520"><rect width="1320" height="520" fill="#fafafa"/><text x="660" y="30" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">Facility-level Yangtze / Yangtze River Delta evidence registry</text><text x="660" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Dashed lines are published service evidence, not yet numeric optimizer edges</text><path d="M95,110 C552.5,75 552.5,35 1010,70" fill="none" stroke="#1b9e77" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.75"><title>gy-waigaoqiao-fast-water-2019</title></path><path d="M95,110 C552.5,75 552.5,195 1010,230" fill="none" stroke="#1b9e77" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.75"><title>gy-yangshan-via-lower-yangtze-2019</title></path><path d="M1010,310 C552.5,275 552.5,175 95,210" fill="none" stroke="#7570b3" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.75"><title>yangpu-tuanjiecun-five-fixed-rail-2011</title></path><path d="M690,90 C850.0,55 850.0,195 1010,230" fill="none" stroke="#7570b3" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.75"><title>longtan-yangshan-daily-rail</title></path><path d="M690,170 C850.0,135 850.0,35 1010,70" fill="none" stroke="#1b9e77" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.75"><title>qiba-longtan-waigaoqiao-fast-water-2025</title></path><path d="M1010,150 C1010.0,115 1010.0,195 1010,230" fill="none" stroke="#d95f02" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.75"><title>luchaogang-yangshan-drayage</title></path><circle cx="95" cy="110" r="9" fill="#2166ac" stroke="#111" stroke-width="1.5"><title>cq-guoyuan-port: Corridor origin gateway; a through service need not stop at every intermediate Yangtze port.</title></circle><text x="95" y="134" text-anchor="middle" font-family="sans-serif" font-size="10">重庆果园港</text><circle cx="95" cy="210" r="9" fill="#bdbdbd" stroke="#111" stroke-width="1.5"><title>cq-tuanjiecun-rail: Verified endpoint of the 2011 five-fixed Chongqing-Shanghai train; it must not be silently collapsed into Guoyuan Port.</title></circle><text x="95" y="234" text-anchor="middle" font-family="sans-serif" font-size="10">重庆团结村铁路集装箱中心站</text><circle cx="245" cy="140" r="9" fill="#67a9cf" stroke="#111" stroke-width="1.5"><title>hb-wuhan-yangluo-port: Admit only when a relevant calling or transfer service is documented; geographic position alone is insufficient.</title></circle><text x="245" y="164" text-anchor="middle" font-family="sans-serif" font-size="10">武汉阳逻港区</text><circle cx="380" cy="140" r="9" fill="#bdbdbd" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"><title>jx-jiujiang-port-unresolved: The historical model used Jiujiang as a transfer city, but the public registry still needs a terminal and service-level match.</title></circle><text x="380" y="164" text-anchor="middle" font-family="sans-serif" font-size="10">九江港（港区待解析）</text><circle cx="520" cy="90" r="9" fill="#bdbdbd" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"><title>ah-anqing-port-unresolved: National-hub eligibility does not prove the historical model&#x27;s rail-water transfer at an exact terminal.</title></circle><text x="520" y="114" text-anchor="middle" font-family="sans-serif" font-size="10">安庆港（港区待解析）</text><circle cx="520" cy="170" r="9" fill="#2166ac" stroke="#111" stroke-width="1.5"><title>ah-wuhu-zhujiaqiao-port: Container and foreign-trade hub; later station upgrades must not be backdated into the 2022 snapshot.</title></circle><text x="520" y="194" text-anchor="middle" font-family="sans-serif" font-size="10">芜湖港朱家桥港区</text><circle cx="520" cy="250" r="9" fill="#fdae61" stroke="#111" stroke-width="1.5"><title>ah-wuhu-yuxikou-port: Coal rail-water hub; excluded from the default general-container graph.</title></circle><text x="520" y="274" text-anchor="middle" font-family="sans-serif" font-size="10">芜湖港裕溪口港区</text><circle cx="520" cy="330" r="9" fill="#fdae61" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"><title>ah-maanshan-port-unresolved: Retain as a commodity-specific candidate until an exact terminal and service are verified.</title></circle><text x="520" y="354" text-anchor="middle" font-family="sans-serif" font-size="10">马鞍山港（港区待解析）</text><circle cx="690" cy="90" r="9" fill="#2166ac" stroke="#111" stroke-width="1.5"><title>js-nanjing-longtan-port: Verified rail access and later daily Shanghai service evidence.</title></circle><text x="690" y="114" text-anchor="middle" font-family="sans-serif" font-size="10">南京港龙潭港区</text><circle cx="690" cy="170" r="9" fill="#67a9cf" stroke="#111" stroke-width="1.5"><title>js-nanjing-qiba-port: Current-reference feeder origin; not backdated to 2022.</title></circle><text x="690" y="194" text-anchor="middle" font-family="sans-serif" font-size="10">南京港七坝港区</text><circle cx="835" cy="90" r="9" fill="#2166ac" stroke="#111" stroke-width="1.5"><title>js-taicang-port: Container core and Shanghai feeder; railway commissioning must be evaluated by snapshot date.</title></circle><text x="835" y="114" text-anchor="middle" font-family="sans-serif" font-size="10">苏州港太仓港区</text><circle cx="835" cy="170" r="9" fill="#67a9cf" stroke="#111" stroke-width="1.5"><title>js-taicang-shanggang-zhenghe: Explicit intermediate terminal in the Shanghai-Chongqing express-water description.</title></circle><text x="835" y="194" text-anchor="middle" font-family="sans-serif" font-size="10">太仓港上港正和码头</text><circle cx="835" cy="250" r="9" fill="#67a9cf" stroke="#111" stroke-width="1.5"><title>js-nantong-tonghai-terminal: Current-reference only; the cited first movement occurred in 2026.</title></circle><text x="835" y="274" text-anchor="middle" font-family="sans-serif" font-size="10">南通港通海集装箱码头</text><circle cx="1010" cy="70" r="9" fill="#2166ac" stroke="#111" stroke-width="1.5"><title>sh-waigaoqiao-port: Do not treat planned direct rail access as operational in the historical snapshot.</title></circle><text x="1010" y="94" text-anchor="middle" font-family="sans-serif" font-size="10">上海港外高桥港区</text><circle cx="1010" cy="150" r="9" fill="#2166ac" stroke="#111" stroke-width="1.5"><title>sh-luchaogang-rail: Separate railway node; connection to Yangshan is a road transfer leg, not a zero-cost in-node mode switch.</title></circle><text x="1010" y="174" text-anchor="middle" font-family="sans-serif" font-size="10">芦潮港铁路集装箱中心站</text><circle cx="1010" cy="230" r="9" fill="#2166ac" stroke="#111" stroke-width="1.5"><title>sh-yangshan-port: Deep-sea container gateway; not the same physical node as Luchaogang railway centre.</title></circle><text x="1010" y="254" text-anchor="middle" font-family="sans-serif" font-size="10">上海港洋山深水港区</text><circle cx="1010" cy="310" r="9" fill="#bdbdbd" stroke="#111" stroke-width="1.5"><title>sh-yangpu-rail: Verified Shanghai endpoint of the 2011 trial train; the source does not identify a Luchaogang or Yangshan rail endpoint.</title></circle><text x="1010" y="334" text-anchor="middle" font-family="sans-serif" font-size="10">上海杨浦铁路货运站</text><circle cx="1180" cy="90" r="9" fill="#2166ac" stroke="#111" stroke-width="1.5"><title>zj-ningbo-chuanshan-port: South-wing sea-rail alternative when the destination is an export gateway, not a Shanghai city consignee.</title></circle><text x="1180" y="114" text-anchor="middle" font-family="sans-serif" font-size="10">宁波舟山港穿山港区</text><circle cx="1180" cy="170" r="9" fill="#bdbdbd" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"><title>zj-jiaxing-port-unresolved: Requires a cargo-relevant scheduled-service record before graph admission.</title></circle><text x="1180" y="194" text-anchor="middle" font-family="sans-serif" font-size="10">嘉兴港（港区待解析）</text><circle cx="1180" cy="250" r="9" fill="#bdbdbd" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"><title>zj-huzhou-port-unresolved: Candidate inland feeder only; city-level port evidence is insufficient for an optimizer node.</title></circle><text x="1180" y="274" text-anchor="middle" font-family="sans-serif" font-size="10">湖州港（港区待解析）</text><text x="95" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">重庆</text><text x="310" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">中游走廊</text><text x="520" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">安徽</text><text x="760" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">江苏</text><text x="1010" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">上海</text><text x="1180" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">浙江</text><circle cx="120" cy="465" r="7" fill="#2166ac"/><text x="133" y="469" font-family="sans-serif" font-size="11">core</text><circle cx="310" cy="465" r="7" fill="#67a9cf"/><text x="323" y="469" font-family="sans-serif" font-size="11">conditional</text><circle cx="500" cy="465" r="7" fill="#fdae61"/><text x="513" y="469" font-family="sans-serif" font-size="11">cargo-specific</text><circle cx="690" cy="465" r="7" fill="#bdbdbd"/><text x="703" y="469" font-family="sans-serif" font-size="11">unresolved/evidence-only</text><line x1="855" y1="465" x2="879" y2="465" stroke="#1b9e77" stroke-width="3" stroke-dasharray="7 5"/><text x="885" y="469" font-family="sans-serif" font-size="11">water</text><line x1="975" y1="465" x2="999" y2="465" stroke="#7570b3" stroke-width="3" stroke-dasharray="7 5"/><text x="1005" y="469" font-family="sans-serif" font-size="11">rail</text><line x1="1095" y1="465" x2="1119" y2="465" stroke="#d95f02" stroke-width="3" stroke-dasharray="7 5"/><text x="1125" y="469" font-family="sans-serif" font-size="11">road</text></svg>
