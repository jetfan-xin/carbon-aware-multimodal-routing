name: Routing validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tools/verify_repository.py
      - run: python -B -m routing examples/synthetic-network.json --solver exact
  geatpy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      REQUIRE_GEATPY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install --no-cache-dir -r requirements-geatpy.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m routing examples/synthetic-network.json --solver geatpy --seed 42
